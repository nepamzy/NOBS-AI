services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nobs
      POSTGRES_PASSWORD: nobs
      POSTGRES_DB: nobs_ai
    ports:
      - "5432:5432"
    volumes:
      - nobs_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  nobs_postgres_data:
