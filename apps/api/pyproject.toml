[project]
name = "nobs-ai-api"
version = "0.1.0"
description = "NOBS AI backend API (V1: YouTube automation pipeline for a single user)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "redis>=5.0,<6.0",
    "rq>=1.16,<2.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# "." resolves the app package (this dir), "../.." resolves services/ at the repo root
# (apps/api is two levels below the repo root).
pythonpath = [".", "../.."]
testpaths = ["tests"]
